name: Build Ssign Tweak

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install ldid
        run: |
          brew install ldid

      - name: Install iOS SDKs
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/theos-sdks"/*.sdk "$HOME/theos/sdks/"

      - name: Build dylib
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1

      - name: Locate output
        run: |
          find . -type f -name "SsignTheme.dylib" -print

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SsignTheme-dylib
          path: .theos/obj/**/SsignTheme.dylib
