name: Build Ssign Safe Dylib

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Install iOS SDKs
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/theos-sdks"/*.sdk "$HOME/theos/sdks/"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make clean
          make FINALPACKAGE=1

      - name: Collect
        run: |
          mkdir -p out
          DYLIB="$(find . -type f -name 'SsignTheme.dylib' | head -n 1)"
          test -n "$DYLIB"
          cp "$DYLIB" out/SsignTheme.dylib
          file out/SsignTheme.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: SsignTheme-safe
          path: out/SsignTheme.dylib
