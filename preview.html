<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ssign Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090c13;color:#f7f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;padding:24px}
.phone{max-width:420px;margin:auto;background:#0b0f18;border:1px solid #20283a;border-radius:34px;padding:20px;box-shadow:0 30px 80px #0008}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;border-radius:15px}.brand h1{margin:0;font-size:26px}.gear{width:42px;height:42px;border-radius:14px;border:1px solid #263148;background:#121827;color:#7aa8ff}
.search{background:#121827;border:1px solid #202b42;border-radius:16px;padding:14px 16px;color:#8894a8;margin-bottom:18px}
.label{font-size:13px;color:#8894a8;margin:14px 3px 10px}.card{display:flex;align-items:center;gap:14px;background:#111722;border:1px solid #1d2940;border-radius:21px;padding:14px;margin-bottom:12px}
.appicon{width:60px;height:60px;border-radius:17px;background:linear-gradient(145deg,#26395e,#172136);display:grid;place-items:center;font-weight:800;color:#7aa8ff}
.info{flex:1}.info b{display:block;font-size:16px;margin-bottom:5px}.info span{font-size:12px;color:#8995aa}.action{border:0;background:#3478f6;color:#fff;padding:10px 13px;border-radius:12px;font-weight:700}
.tabs{margin-top:20px;padding:12px;background:#111722;border:1px solid #1d2940;border-radius:18px;display:flex;justify-content:space-around;color:#8894a8}.active{color:#6fa1ff}
</style><div class="phone"><div class="head"><div class="brand"><img src="SsignLogo.png"><div><h1>Ssign</h1><small style="color:#7f8ba0">مدير التطبيقات والتوقيع</small></div></div><button class="gear">⚙</button></div>
<div class="search">ابحث في التطبيقات...</div><div class="label">التطبيقات</div>
<div class="card"><div class="appicon">A</div><div class="info"><b>تطبيق تجريبي</b><span>الإصدار 5.2 • 125 MB</span></div><button class="action">فتح</button></div>
<div class="card"><div class="appicon">S</div><div class="info"><b>Ssign</b><span>جاهز للتوقيع</span></div><button class="action">توقيع</button></div>
<div class="card"><div class="appicon">F</div><div class="info"><b>ملف IPA</b><span>آخر تعديل اليوم</span></div><button class="action">إدارة</button></div>
<div class="tabs"><span class="active">التطبيقات</span><span>الملفات</span><span>الشهادات</span><span>الإعدادات</span></div></div></html>
